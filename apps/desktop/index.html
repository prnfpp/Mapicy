      La politica di sicurezza dei contenuti è restrittiva di proposito:
      nell'applicativo si incollano elenchi copiati dalle piattaforme, e questa
      riga è quello che impedisce a un testo incollato di diventare codice.

      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Mapicy — Mappatura degli accessi</title>
  </head>
